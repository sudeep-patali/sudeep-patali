<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#07060c"/>
      <stop offset="35%"  stop-color="#0e0a1a"/>
      <stop offset="65%"  stop-color="#0b0e1c"/>
      <stop offset="100%" stop-color="#07060c"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFB020">
        <animate attributeName="stop-color" values="#FFB020;#8B5CF6;#22D3EE;#FFB020" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#FFB020;#8B5CF6" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#FFB020;#8B5CF6;#22D3EE" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="20%"  stop-color="#FFB020">
        <animate attributeName="stop-color" values="#FFB020;#8B5CF6;#22D3EE;#FFB020" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#FFB020;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%"  stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#FFB020;#8B5CF6;#22D3EE" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="150" cy="60" r="220" fill="url(#glowA)">
    <animate attributeName="r" values="220;250;220" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="300" r="260" fill="url(#glowB)">
    <animate attributeName="r" values="260;230;260" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- drifting particle field -->
  <g fill="#ffffff">
    <circle cx="900" cy="50" r="1.6" opacity="0.4"><animate attributeName="cy" values="50;36;50" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.65;0.15" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="120" r="1.3" opacity="0.35"><animate attributeName="cy" values="120;100;120" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="220" r="1.8" opacity="0.45"><animate attributeName="cy" values="220;200;220" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="270" r="1.4" opacity="0.4"><animate attributeName="cy" values="270;255;270" dur="6.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.8s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="230" r="1.5" opacity="0.35"><animate attributeName="cy" values="230;212;230" dur="7.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.55;0.15" dur="7.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="90" r="1.5" opacity="0.4"><animate attributeName="cy" values="90;72;90" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scanning light sweep -->
  <rect x="-200" y="0" width="200" height="340" fill="url(#nameGrad)" opacity="0.06">
    <animate attributeName="x" values="-200;1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1200" height="4" fill="url(#accentLine)"/>
  <rect x="0" y="336" width="1200" height="4" fill="url(#accentLine)"/>

  <!-- corner brackets -->
  <path d="M 36 30 L 36 54 M 36 30 L 60 30" stroke="#FFB020" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 1164 30 L 1164 54 M 1164 30 L 1140 30" stroke="#22D3EE" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 36 310 L 36 286 M 36 310 L 60 310" stroke="#22D3EE" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 1164 310 L 1164 286 M 1164 310 L 1140 310" stroke="#FFB020" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- avatar ring -->
  <g transform="translate(150,170)">
    <circle r="78" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="78" fill="none" stroke="url(#nameGrad)" stroke-width="2.5" stroke-dasharray="12 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="64" fill="#0d0a18" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="0" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="46" font-weight="700" fill="url(#nameGrad)">SP</text>
  </g>

  <text x="270" y="128" font-family="'JetBrains Mono', monospace" font-size="17" letter-spacing="4" fill="#8B5CF6" opacity="0.9">HELLO WORLD, I'M</text>

  <text x="268" y="188" font-family="'JetBrains Mono', monospace" font-size="58" font-weight="800" fill="url(#nameGrad)" filter="url(#softGlow)">Sudeep P</text>

  <text x="270" y="228" font-family="'JetBrains Mono', monospace" font-size="19" fill="#e6e6f0" opacity="0.92">Full-Stack Developer · AI Integration Enthusiast</text>

  <text x="270" y="262" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8a8a9e">React · Node.js · SQL · Prompt Engineering · Deep Learning</text>

  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#5f5f75">
    <text x="270" y="296">📍 Puttur, Karnataka, India</text>
  </g>
</svg>
