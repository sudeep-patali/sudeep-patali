<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020"/><stop offset="100%" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <circle cx="500" cy="240" r="160" fill="url(#coreGlow)"/>
  <circle cx="500" cy="240" r="54" fill="#0c0a17" stroke="url(#ringB)" stroke-width="2"/>
  <text x="500" y="234" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e8e8f5" font-weight="700">FULL</text>
  <text x="500" y="253" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e8e8f5" font-weight="700">STACK</text>

  <!-- Ring 1: Frontend -->
  <circle cx="500" cy="240" r="110" fill="none" stroke="url(#ringA)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 240" to="360 500 240" dur="22s" repeatCount="indefinite"/>
    <g transform="translate(610,240)"><circle r="26" fill="#0c0a17" stroke="url(#ringA)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFB020" transform="rotate(0)">React</text></g>
    <g transform="translate(445,145)"><circle r="26" fill="#0c0a17" stroke="url(#ringA)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFB020">TS</text></g>
    <g transform="translate(445,335)"><circle r="26" fill="#0c0a17" stroke="url(#ringA)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFB020">CSS3</text></g>
  </g>

  <!-- Ring 2: Backend -->
  <circle cx="500" cy="240" r="175" fill="none" stroke="url(#ringB)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 500 240" to="0 500 240" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(675,240)"><circle r="27" fill="#0c0a17" stroke="url(#ringB)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22D3EE">Node</text></g>
    <g transform="translate(390,90)"><circle r="27" fill="#0c0a17" stroke="url(#ringB)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#22D3EE">Express</text></g>
    <g transform="translate(610,390)"><circle r="27" fill="#0c0a17" stroke="url(#ringB)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22D3EE">MySQL</text></g>
    <g transform="translate(390,390)"><circle r="27" fill="#0c0a17" stroke="url(#ringB)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22D3EE">Mongo</text></g>
  </g>

  <!-- Ring 3: AI + Tools -->
  <circle cx="500" cy="240" r="230" fill="none" stroke="url(#ringC)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 240" to="360 500 240" dur="38s" repeatCount="indefinite"/>
    <g transform="translate(730,240)"><circle r="28" fill="#0c0a17" stroke="url(#ringC)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#34D399">Python</text></g>
    <g transform="translate(340,50)"><circle r="28" fill="#0c0a17" stroke="url(#ringC)" stroke-width="2"/><text text-anchor="middle" y="4" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#34D399">TensorFlow</text></g>
    <g transform="translate(660,430)"><circle r="28" fill="#0c0a17" stroke="url(#ringC)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#34D399">GCP</text></g>
    <g transform="translate(270,240)"><circle r="28" fill="#0c0a17" stroke="url(#ringC)" stroke-width="2"/><text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">Git</text></g>
    <g transform="translate(340,430)"><circle r="28" fill="#0c0a17" stroke="url(#ringC)" stroke-width="2"/><text text-anchor="middle" y="4" font-family="'JetBrains Mono', monospace" font-size="7" fill="#34D399">LLM APIs</text></g>
  </g>

  <text x="500" y="465" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5f5f75">Frontend  ·  Backend  ·  AI &amp; Cloud Tooling</text>
</svg>
