name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk@v3.3.0
        with:
          github_user_name: sudeep-patali
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#0a0813,#3b1f6b,#6d3fc9,#8B5CF6,#22D3EE
            assets/snake-light.svg?palette=github&color_snake=#8B5CF6&color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake-*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🐍 Update snake animation [$(date +'%Y-%m-%d')]"
            git pull --rebase
            git push
          fi
